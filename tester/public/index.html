<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Swap Tester</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="status-msg" class="status-msg"></div>
    <div id="app">
        <div id="left-panel">
            <h1 class="title">Push Swap</h1>

            <div class="control-group">
                <label class="control-label">Numbers (space separated)</label>
                <textarea id="numbers-input" placeholder="e.g. 4 67 3 87 70 15 100 2 69 1" rows="4"></textarea>
            </div>

            <div class="control-group btn-row">
                <button id="random-btn" class="btn btn-primary">Random 100</button>
                <button id="random500-btn" class="btn btn-primary">Random 500</button>
            </div>
            <div class="control-group">
                <button id="load-btn" class="btn btn-secondary">Load</button>
            </div>

            <div class="control-group">
                <button id="solve-btn" class="btn btn-accent">Solve</button>
            </div>

            <div class="control-group">
                <label class="control-label">Speed</label>
                <div class="slider-container">
                    <span class="slider-label">Slow</span>
                    <input type="range" id="speed-slider" min="0" max="200" value="100" class="slider">
                    <span class="slider-label">Fast</span>
                </div>
            </div>

            <div class="control-group">
                <div class="stats-row">
                    <div class="stat-box">
                        <span class="stat-label">Moves</span>
                        <span id="stat-moves" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Step</span>
                        <span id="stat-step" class="stat-value">0/0</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="right-panel">
            <div id="stacks-container">
                <div class="stack-wrapper">
                    <h3 class="stack-title">Stack A</h3>
                    <div id="stack-a" class="stack"></div>
                </div>
                <div class="stack-wrapper">
                    <h3 class="stack-title">Stack B</h3>
                    <div id="stack-b" class="stack"></div>
                </div>
            </div>
            <div id="moves-panel">
                <div class="moves-header">Instructions</div>
                <div id="moves-bar">
                    <div id="moves-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
